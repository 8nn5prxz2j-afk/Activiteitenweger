<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Activiteitenweger</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a237e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Activiteiten">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="stylesheet" href="css/styles.css">

  <!-- SheetJS with styling support for formatted Excel export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.min.js"></script>
  <!-- Firebase SDK (compat mode for simple usage) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <!-- Chart.js for dagtotaal graphs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.1.0/dist/chartjs-plugin-annotation.min.js"></script>
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar" id="navbar"></nav>

  <!-- Main Content Area -->
  <div class="app-body" id="appBody"></div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div> Ontspanning (-1/½u)</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--yellow)"></div> Licht (+1/½u)</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--orange)"></div> Gemiddeld (+2/½u)</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div> Zwaar (+3/½u)</div>
  </div>

  <!-- Activity Add/Edit Modal -->
  <div class="modal-overlay" id="modal" onclick="if(event.target===this)App.closeModal()">
    <div class="modal">
      <h2 id="modalTitle">Activiteit toevoegen</h2>
      <div class="form-group">
        <label>Activiteit</label>
        <select id="actSelect" onchange="App.updateModalPreview()">
          <option value="">-- Kies een activiteit --</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Starttijd</label>
          <input type="time" id="actStart" step="900">
        </div>
        <div class="form-group">
          <label>Duur</label>
          <div class="duration-stepper">
            <button type="button" class="dur-btn" onclick="App.stepDuration(-15)" aria-label="15 minuten korter">−</button>
            <input type="hidden" id="actDuration" value="30">
            <span class="dur-display" id="actDurationLabel">30 min</span>
            <button type="button" class="dur-btn" onclick="App.stepDuration(15)" aria-label="15 minuten langer">+</button>
          </div>
        </div>
      </div>
      <!-- Status-toggle: alleen zichtbaar voor vandaag en toekomst -->
      <div class="form-group" id="statusToggleGroup" style="display:none">
        <label>Status</label>
        <div class="segmented-control" id="statusToggle">
          <button type="button" class="seg-btn seg-active" data-value="done" onclick="App.setModalStatus('done')">Gedaan</button>
          <button type="button" class="seg-btn" data-value="planned" onclick="App.setModalStatus('planned')">Gepland</button>
        </div>
      </div>
      <div class="form-group" id="previewPoints" style="font-size:14px;font-weight:500;"></div>
      <div class="modal-actions">
        <button class="btn btn-danger" id="btnDelete" style="display:none;margin-right:auto;" onclick="App.deleteModal()">Verwijder</button>
        <button class="btn btn-secondary" onclick="App.closeModal()">Annuleren</button>
        <button class="btn btn-primary" onclick="App.saveModal()">Opslaan</button>
      </div>
    </div>
  </div>

  <!-- Scripts (order matters) -->
  <script src="js/data.js"></script>
  <script src="js/day-view.js"></script>
  <script src="js/week-view.js"></script>
  <script src="js/month-view.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/excel-export.js"></script>
  <script src="js/chart-view.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>

  <!-- Populate activity select -->
  <script>
    const sel = document.getElementById('actSelect');
    categories.forEach(cat => {
      const optgroup = document.createElement('optgroup');
      optgroup.label = cat.group;
      cat.items.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.name;
        opt.textContent = `${item.name} (${item.ptsPerHalf > 0 ? '+' : ''}${item.ptsPerHalf}/½u)`;
        optgroup.appendChild(opt);
      });
      sel.appendChild(optgroup);
    });
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
